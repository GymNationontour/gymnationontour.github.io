$("eye").addEventListener("click", () => {
  const p = $("staticrypt-password"), show = p.type === "password";
  p.type = show ? "text" : "password"; $("eye").textContent = show ? "HIDE" : "SHOW";
  $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
});

$("staticrypt-form").addEventListener("submit", async e => {
  e.preventDefault();
  const user = $("staticrypt-username").value.trim().toLowerCase(), pass = $("staticrypt-password").value;
  const go = $("go"); go.disabled = true; go.textContent = "Checking…"; $("err").classList.add("hidden");
  // the page key is "username:password" (username not case-sensitive, password is)
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(user + ":" + pass, $("staticrypt-remember").checked);
  if (!isSuccessful) {
    go.disabled = false; go.textContent = "LET'S GO";
    $("err").textContent = templateError; $("err").classList.remove("hidden");
    $("staticrypt-password").select();
  }
});
})();
</script>
</body>
</html>
